<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Как это называется на самом деле</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600&display=swap">
<style>
:root{--bg:#F5F6F3;--ink:#1A1E2B;--mute:#5E6472;--line:#DDE0E6;--acc:#2F5BFF;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#F5F6F3;--ink:#1A1E2B;--mute:#5E6472;--line:#DDE0E6;--card:#fff}}
:root[data-theme="dark"]{--bg:#F5F6F3;--ink:#1A1E2B;--mute:#5E6472;--line:#DDE0E6;--card:#fff}
*,*::before,*::after{box-sizing:border-box}
html{height:auto}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
main{max-width:1180px;margin:0 auto;padding:clamp(28px,6vw,72px) clamp(14px,4vw,40px) 56px}
h1{font-family:"Fraunces",Georgia,"Times New Roman",serif;font-weight:600;font-size:clamp(32px,6.2vw,68px);line-height:1.04;letter-spacing:-.02em;margin:0 0 14px;max-width:15ch}
.lead{font-size:clamp(16px,2vw,19px);color:var(--mute);max-width:52ch;margin:0 0 clamp(24px,4vw,40px)}
.stage{position:relative;line-height:0;border-radius:22px;overflow:hidden;background:#3a2a22;box-shadow:0 24px 60px -24px rgba(26,30,43,.45);touch-action:manipulation}
.stage img{width:100%;height:auto;display:block;user-select:none;-webkit-user-drag:none}
.dot{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;padding:0;border:0;background:none;cursor:pointer;z-index:2;-webkit-tap-highlight-color:transparent}
.dot i{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--acc);border:3px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.45);transition:transform .22s cubic-bezier(.3,1.5,.5,1),background .2s}
.dot::before{content:"";position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:rgba(255,255,255,.55);animation:pulse 2.2s ease-out infinite}
.dot:hover i,.dot.on i{transform:scale(1.4);background:#fff;border-color:var(--acc)}
.dot:focus-visible{outline:2px solid #fff;border-radius:50%}
@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(3);opacity:0}}
.card{position:absolute;left:0;top:0;width:270px;max-width:calc(100% - 16px);padding:16px 18px 17px;background:var(--card);border-radius:16px;box-shadow:0 18px 40px rgba(10,14,30,.35),0 2px 6px rgba(10,14,30,.12);line-height:1.5;z-index:5;opacity:0;visibility:hidden;transform:translateY(8px) scale(.97);transition:opacity .2s,transform .2s,visibility .2s;pointer-events:none}
.card.show{opacity:1;visibility:visible;transform:none}
.card b{display:block;font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:22px;letter-spacing:-.01em;margin-bottom:4px}
.card span{display:block;font-size:14.5px;color:var(--mute)}
.terms{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 0;padding:0;list-style:none}
.terms button{font:inherit;font-weight:600;font-size:15px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 18px;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.terms button:hover,.terms button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.hint{font-size:14px;color:var(--mute);margin:14px 0 0}
@media(max-width:600px){.stage{border-radius:14px}.card{width:230px;padding:13px 15px}.card b{font-size:19px}.card span{font-size:13.5px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<main>

    t=Math.max(8,Math.min(H-ch-8,t));card.style.left=l+'px';card.style.top=t+'px';
  }
  function hide(){card.classList.remove('show');dots.concat(chips).forEach(function(d){d.classList.remove('on')});cur=-1}
  document.addEventListener('click',function(e){if(!card.contains(e.target))hide()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')hide()});
  addEventListener('resize',function(){if(cur>-1)show(cur)});
})();
</script>
</body>
